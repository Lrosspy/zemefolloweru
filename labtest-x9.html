<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>t</title><body style="margin:0;background:#9bd">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script><script>
function rnd(seed){let s=seed>>>0;return()=>{s=Math.imul(s^(s>>>15),2246822507);s=Math.imul(s^(s>>>13),3266489909);s^=s>>>16;return(s>>>0)/4294967296}}
const matCache={};const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));
function buildMagicLab(){ // kamenná chatka se břidlicovou střechou, kouzelný strom se zářícími žilkami, krystaly, barevný kouř z komína; dveře zatlučené prkny
  const g=new THREE.Group(),S=1.6,b=new THREE.Group();b.scale.setScalar(S);g.add(b);
  const glow=c=>new THREE.MeshBasicMaterial({color:c}),stone=mat('#8d9199'),stoneD=mat('#6c7078'),slate=mat('#55606e'),moss=mat('#4f7a3a'),wood=mat('#6a4628'),woodD=mat('#4a301a');
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.46,.5,.05,22),mat('#3f6a34'));base.position.y=-.01;b.add(base);
  const dirt=new THREE.Mesh(new THREE.CylinderGeometry(.5,.44,.06,22),mat('#5a4130'));dirt.position.y=-.06;b.add(dirt);
  // chatka
  const body=new THREE.Mesh(new THREE.BoxGeometry(.34,.2,.26),stone);body.position.set(.08,.1,0);b.add(body);
  const rr=rnd(31);for(let i=0;i<22;i++){const st=new THREE.Mesh(new THREE.BoxGeometry(.045,.025,.008),rr()<.5?stoneD:stone);st.position.set(-.07+rr()*.3,.02+rr()*.17,.132);b.add(st)}
  for(const sx of [-1,1]){const r=new THREE.Mesh(new THREE.BoxGeometry(.38,.012,.2),slate);r.position.set(.08,.255,sx*.07);r.rotation.x=sx*.62;b.add(r)}
  const gable=new THREE.Shape();gable.moveTo(-.13,0);gable.lineTo(.13,0);gable.lineTo(0,.1);gable.closePath();
  for(const x of [-.09,.25]){const gm=new THREE.Mesh(new THREE.ExtrudeGeometry(gable,{depth:.01,bevelEnabled:false}),stone);gm.rotation.y=Math.PI/2;gm.position.set(x,.2,.0);b.add(gm)}
  const mossTop=new THREE.Mesh(new THREE.BoxGeometry(.1,.015,.05),moss);mossTop.position.set(-.03,.27,.06);mossTop.rotation.x=.62;b.add(mossTop);
  const chim=new THREE.Mesh(new THREE.BoxGeometry(.04,.09,.04),stoneD);chim.position.set(.16,.3,-.02);b.add(chim);
  // kouzelný kouř a kruhy nad komínem
  const smoke=new THREE.Group();smoke.position.set(.16,.36,-.02);b.add(smoke);
  [['#3ff2d8',.03,.0],['#ff4fd8',.04,.05],['#3ff2d8',.035,.1],['#ffd23a',.025,.14]].forEach(([c,r,y])=>{const p=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));p.position.y=y;smoke.add(p)});
  ['#3ff2d8','#ff4fd8','#ffd23a'].forEach((c,i)=>{const t=new THREE.Mesh(new THREE.TorusGeometry(.05+i*.012,.002,4,24),glow(c));t.rotation.x=Math.PI/2+.3*(i-1);t.position.y=.05+i*.03;smoke.add(t)});
  smoke.userData.spin=true;g.userData.mlabSmoke=smoke;
  // okno s galaxií, dveře zatlučené prkny, zářící runy
  const win=new THREE.Mesh(new THREE.CircleGeometry(.032,16),glow('#7a4bff'));win.position.set(-.01,.12,.131);b.add(win);
  const sw=new THREE.Mesh(new THREE.TorusGeometry(.018,.004,4,16),glow('#ff9af0'));sw.position.set(-.01,.12,.132);b.add(sw);
  const door=new THREE.Mesh(new THREE.BoxGeometry(.07,.13,.008),wood);door.position.set(.12,.065,.132);b.add(door);
  for(const r of [.5,-.5]){const pl=new THREE.Mesh(new THREE.BoxGeometry(.09,.014,.006),woodD);pl.position.set(.12,.07,.138);pl.rotation.z=r;b.add(pl)}
  const lock=new THREE.Mesh(new THREE.BoxGeometry(.018,.016,.008),mat('#c9a233'));lock.position.set(.12,.07,.143);b.add(lock);
  const shackle=new THREE.Mesh(new THREE.TorusGeometry(.007,.002,4,10,Math.PI),mat('#c9a233'));shackle.position.set(.12,.078,.143);b.add(shackle);
  const rc=['#3ff2d8','#ff4fd8','#5dff8a','#ffd23a'],r2=rnd(9);
  for(let i=0;i<12;i++){const rn=new THREE.Mesh(new THREE.BoxGeometry(.004,.016,.003),glow(rc[i%4]));rn.position.set(i<6?.04+r2()*.02:.2+r2()*.02,.03+((i%6)*.028),.133);rn.rotation.z=(r2()-.5)*1.2;b.add(rn)}
  // strom se zářícími žilkami
  const tree=new THREE.Group();tree.position.set(-.22,0,-.02);b.add(tree);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.025,.05,.32,7),mat('#5a4030'));trunk.position.y=.16;trunk.rotation.z=.12;tree.add(trunk);
  for(const [c,x,z] of [['#4fb0ff',.02,.03],['#ffc83a',-.02,.035],['#4fb0ff',.03,-.02]]){const v=new THREE.Mesh(new THREE.BoxGeometry(.004,.26,.004),glow(c));v.position.set(x,.15,z);v.rotation.z=.12;tree.add(v)}
  const leaf=mat('#2f5a2c'),leaf2=mat('#3d6e35');[[0,.38,0,.13],[-.08,.33,.05,.09],[.08,.34,-.04,.1],[0,.46,.02,.09],[-.05,.42,-.06,.08]].forEach(([x,y,z,r],i)=>{const l=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),i%2?leaf:leaf2);l.position.set(x+.02,y,z);tree.add(l)});
  for(const a of [0,2.1,4.2]){const root=new THREE.Mesh(new THREE.CylinderGeometry(.008,.016,.09,5),mat('#5a4030'));root.position.set(Math.cos(a)*.05,.015,Math.sin(a)*.05);root.rotation.z=Math.PI/2.4;root.rotation.y=a;tree.add(root)}
  // krystaly a hrnce s krystaly
  const cry=new THREE.MeshLambertMaterial({color:'#b48cff',emissive:'#7a3cff',emissiveIntensity:.8,flatShading:true});
  [[-.32,.03,.18,.035],[-.1,.02,.2,.025],[-.3,.02,-.12,.03],[.32,.02,.16,.02]].forEach(([x,y,z,r])=>{const c=new THREE.Mesh(new THREE.OctahedronGeometry(r),cry);c.scale.y=1.8;c.position.set(x,y+r,z);b.add(c)});
  for(const [x,c] of [[.04,'#7fd8ff'],[.2,'#9affb8'],[.26,'#c9a2ff']]){const pot=new THREE.Mesh(new THREE.CylinderGeometry(.018,.014,.03,8),mat('#b0763a'));pot.position.set(x,.015,.17);b.add(pot);
    const cc=new THREE.Mesh(new THREE.OctahedronGeometry(.014),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.6,flatShading:true}));cc.scale.y=1.6;cc.position.set(x,.045,.17);b.add(cc)}
  const light=new THREE.PointLight('#b48cff',.6,.9);light.position.set(0,.2,.25);b.add(light);
  g.userData.height=.75*S;return g;
}

const r=new THREE.WebGLRenderer({antialias:true});r.setSize(800,600);document.body.append(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#9bd');sc.add(new THREE.HemisphereLight('#fff','#556',0.9));const dl=new THREE.DirectionalLight('#fff',.6);dl.position.set(2,3,2);sc.add(dl);
const cam=new THREE.PerspectiveCamera(40,800/600,.01,20);cam.position.set(.9,1.0,1.9);cam.lookAt(0,.4,0);const g=buildMagicLab();g.rotation.y=-.35;sc.add(g);r.render(sc,cam);
</script>
