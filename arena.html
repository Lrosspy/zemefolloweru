<html lang="cs">
<head>

<style>
:root{--ink:#fff1e0;--dim:#d8bfa8;--fire:#ff7a1a;--sun:#ffc300;--hp:#53d16b;--mhp:#ff4a2a;--panel:rgba(20,8,6,.8);--line:rgba(255,170,110,.25);
  --display:"Bungee",ui-rounded,system-ui,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:#120605;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;z-index:2;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);padding:0 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px);min-width:0}
.card .nm{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:900;white-space:nowrap}
.card .nm span{overflow:hidden;text-overflow:ellipsis}
.card .nm b{font-variant-numeric:tabular-nums;flex:none}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.55);margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%;background:var(--hp);border-radius:99px;transition:width .45s ease,background .3s}
.card.m .bar i{background:var(--mhp)}
.bar.sta{height:6px;margin-top:4px}.bar.sta i,.card.m .bar.sta i{background:#ffc300}
.card .sub{margin-top:5px;font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floor{text-align:center;padding-top:2px}
.floor b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(24px,5.6vw,40px);line-height:1;background:linear-gradient(180deg,#fff3c4,#ffcf4a 35%,#ff7a1a 70%,#d2260c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a0700)}
.floor span{display:block;margin-top:4px;font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.back{position:fixed;z-index:3;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 182px);font:900 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;text-decoration:none}
.turn{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 184px);font:900 13px var(--body);letter-spacing:1px;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap;transition:color .2s,border-color .2s}
.turn.me{color:var(--sun);border-color:rgba(255,195,0,.6)}
.turn.mon{color:#ff8a6a}
.log{position:fixed;z-index:2;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);text-align:center;font-size:13px;font-weight:700;color:var(--dim);min-height:18px;text-shadow:0 1px 3px #000}
.log b{color:var(--ink)}
.acts{position:fixed;z-index:3;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 16px));bottom:0;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 8px);display:grid;gap:5px;background:linear-gradient(rgba(18,6,5,0),rgba(18,6,5,.85) 30%)}
.acts button{font:inherit;color:var(--ink);background:linear-gradient(180deg,#4a1d10,#2a0d07);border:2px solid rgba(255,140,60,.45);border-radius:12px;padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .08s,opacity .2s,border-color .2s}
.acts .row4,.acts .row5{display:grid;gap:5px}.acts .row4{grid-template-columns:repeat(4,minmax(0,1fr))}.acts .row5{grid-template-columns:repeat(5,minmax(0,1fr))}
.acts button .ic{font-size:17px;line-height:1}
.acts button .tx{display:flex;flex-direction:column;align-items:center;gap:2px}
.acts button .t{font-family:var(--display);font-size:11px;line-height:1.1;white-space:nowrap}
.acts button .d{font-size:9.5px;font-weight:900;color:var(--dim);white-space:nowrap}
.acts button:not(:disabled):hover{border-color:var(--sun)}
.acts button:not(:disabled):active{transform:scale(.96)}
.acts button.atk{background:linear-gradient(180deg,#b3260c,#6a1105);border-color:#ffb36b}
.acts button:disabled{opacity:.35;cursor:not-allowed}
.acts button.boost:not(:disabled){border-color:#fff3a0;box-shadow:0 0 18px rgba(255,220,80,.7)}
.crowd{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:min(240px,60%);text-align:center;font:900 11px var(--body);letter-spacing:.5px;color:var(--dim)}
.crowd .cbar{height:7px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);overflow:hidden;margin-bottom:3px}
.crowd .cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#ffe27a);transition:width .4s}
.crowd.full{color:#fff3a0}.crowd.full .cbar i{box-shadow:0 0 12px #ffe27a}
.acts button:focus-visible,.back:focus-visible,.modal button:focus-visible,.modal a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:rgba(10,3,2,.72);backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.modal>div{width:min(360px,100%);background:#1f0c08;border:1px solid var(--line);border-radius:20px;padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h1{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.modal p{margin:0 0 16px;color:var(--dim);line-height:1.45}
.modal p b{color:var(--ink)}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.modal button,.modal a{font:900 15px var(--body);border-radius:999px;padding:12px 20px;border:0;cursor:pointer;text-decoration:none;display:inline-block}
.modal .go{background:linear-gradient(180deg,#ff8a3a,#d2260c);color:#fff}
.modal .city{background:#3a2a22;color:var(--ink)}
.modal .gold{background:var(--sun);color:#2b1d0e}
@media (max-width:560px){
  .top{grid-template-columns:1fr 1fr;grid-template-areas:"f f" "p m"}
  .top .floor{grid-area:f}.top .card.p{grid-area:p}.top .card.m{grid-area:m}
  .turn{left:auto;right:12px;transform:none}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<body>
<canvas id="cv" aria-label="Aréna: tvoje postava vlevo, příšera vpravo, mezi vámi dráha o deseti krocích"></canvas>
<header class="top">
  <section class="card p" aria-label="Tvoje životy"><div class="nm"><span id="pName">Ty</span><b id="pHpT">100 / 100</b></div><div class="bar"><i id="pHp"></i></div><div class="bar sta" title="Výdrž"><i id="pSta"></i></div><div class="sub" id="pSub">Pěsti · útok 10</div></section>
  <div class="floor"><b id="floorT">PATRO 1</b><span id="floorS">Prolog</span></div>
  <section class="card m" aria-label="Životy příšery"><div class="nm"><span>Lávový golem</span><b id="mHpT">100 / 100</b></div><div class="bar"><i id="mHp"></i></div><div class="bar sta" title="Výdrž"><i id="mSta"></i></div><div class="sub" id="mSub">útok 15</div></section>
</header>
<a class="back" id="back" href="./">← Město</a>

<div class="crowd" id="crowdW" aria-live="polite"><div class="cbar"><i id="crowd"></i></div><span id="crowdT">Diváci 0 %</span></div>
<nav class="acts" aria-label="Tvůj tah"><div class="row4" id="rowAtk"></div><div class="row5" id="rowMove"></div></nav>
<section class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mT"><div><h1 id="mT"></h1><p id="mP"></p><div class="row" id="mRow"></div></div></section>
<script>
(()=>{
const LIVE_DB='https://planetafolloweru-default-rtdb.europe-west1.firebasedatabase.app';
const FB_API_KEY='AIzaSyALYbgJBfpRJSw2UHdCbFxwz5hHkiIiS_E';
const SESSION_MS=60*60*1000,LOGIN_AT='planeta-login-at';
const ARENA_FROM=1795604400000,ADMIN='lubikosuch'; // středa 25. 11. 2026 12:00; do té doby jen admin
const $=id=>document.getElementById(id);
const liveKey=id=>id.replace(/\./g,'-');
const q=new URLSearchParams(location.search);
const look={shirt:q.get('s')||'#c4523a',skin:q.get('k')||'#f1c9a5',hat:q.get('h')||''};
const DEMO=q.has('demo'); // jen na zkoušku: hraje se bez přihlášení a nic se neukládá

// ---------- pravidla boje (čistá logika, bez kreslení) ----------
/*LOGIC*/
// Boj ve stylu Sword and Sandals: 3 druhy útoku, výdrž, pohyb o víc polí, provokace a diváci
const TRACK=10,REST=20,STA_REST=40,STA_REGEN=6,HAND=10,CROWD_MAX=100;
const W8={boss_sword:2,basic_sword:1.2,basic_sword_g:1.3,wood_sword_1:1.1,wood_sword_2:1.1,wood_sword_3:1.2},TAL={earth_heart_1:1.5,earth_heart_2:1.2,earth_heart_3:1};
// základní výbava z obchodu: šance zásahu u meče, výdrž u kalhot, útok a obrana u rukavic, HP u kalhot a rukavic
const HIT={wood_sword_2:.05,wood_sword_3:-.05},STA={cloth_pants_3:10},ATKG={cloth_gloves_2:1},DEF={cloth_gloves_3:.05};
const CLOTH_HP={cloth_pants_1:5,cloth_pants_2:7,cloth_pants_3:5,cloth_gloves_1:5,cloth_gloves_2:3,cloth_gloves_3:5};
const hpMaxOf=g=>100+(g.banner==='founder_cape'?50:0)+(g.boots==='arena_boots'?30:0)+(CLOTH_HP[g.pants]||0)+(CLOTH_HP[g.gloves]||0);
const ATK={quick:{mul:.6,hit:.85,sta:8},normal:{mul:1,hit:.7,sta:16},power:{mul:1.7,hit:.45,sta:30}};
const MOVE={step:{d:1,sta:4},run:{d:3,sta:12},back:{d:-1,sta:4},jump:{d:-1,sta:10}};
function monsterOf(f){const tier=Math.floor(f/10);return {hp:tier?105+5*tier:100,dmg:15+5*tier}} // 1–9: 100/15 · 10–19: 110/20 · každých dalších 10 pater +5/+5
function playerDmg(gear){return Math.round(HAND*(W8[gear.weapon]||1)+(TAL[gear.talisman]||0)+(ATKG[gear.gloves]||0))}
const fighter=(pos,hp,max,dmg,smax=100)=>({pos,hp,max,dmg,sta:smax,smax,jump:false,rage:false,hit:0});
function newFight(f,hp,hpMax,gear){const m=monsterOf(f),p=fighter(0,hp,hpMax,playerDmg(gear),100+(STA[gear.pants]||0));p.hit=HIT[gear.weapon]||0;const mon=fighter(TRACK,m.hp,m.hp,m.dmg);mon.hit=-(DEF[gear.gloves]||0);return {f,p,m:mon,crowd:0,block:gear.shield==='arena_shield'?.25:0,over:null}}
const dist=S=>S.m.pos-S.p.pos;
const atkDmg=(A,a,boost)=>Math.round(A.dmg*ATK[a].mul*(boost?1.5:1));
function canDo(S,who,a){
  const A=S[who],d=dist(S);
  if(ATK[a])return d<=1&&A.sta>=ATK[a].sta;
  if(a==='step'||a==='run')return d>1&&A.sta>=MOVE[a].sta;
  if(a==='back')return A.sta>=MOVE.back.sta&&(who==='p'?A.pos>0:A.pos<TRACK);
  if(a==='jump')return A.sta>=MOVE.jump.sta;
  return a==='rest'||a==='taunt'||a==='roar';
}
// jedna akce jednoho bojovníka; vrací události pro animaci
function doAct(S,who,a,rnd){
  const o=who==='p'?'m':'p',me=S[who],foe=S[o],dir=who==='p'?1:-1,ev=[],cr=n=>{if(n)S.crowd=Math.max(0,Math.min(CROWD_MAX,S.crowd+n))};
  me.jump=false;let regen=true;
  if(!canDo(S,who,a))a='rest';
  if(MOVE[a]){
    me.sta-=MOVE[a].sta;
    const n=a==='step'||a==='run'?Math.min(MOVE[a].d,dist(S)-1):1,back=a==='back'||a==='jump';
    const to=Math.max(0,Math.min(TRACK,me.pos+(back?-dir:dir)*n));me.pos=to;
    if(a==='jump')me.jump=true;
    ev.push({who,kind:a});
  }else if(a==='rest'){
    const n=Math.min(REST,me.max-me.hp),s=Math.min(STA_REST,me.smax-me.sta);me.hp+=n;me.sta+=s;regen=false;
    if(who==='p')cr(-5);ev.push({who,kind:'rest',n,s});
  }else if(a==='taunt'){cr(30);foe.rage=true;ev.push({who,kind:'taunt'})}
  else if(a==='roar'){ev.push({who,kind:'roar'})}
  else{
    const A=ATK[a];me.sta-=A.sta;const boost=who==='p'&&S.crowd>=CROWD_MAX;
    const chance=A.hit+(me.hit||0)-(me.rage?.2:0);me.rage=false;
    ev.push({who,kind:'atk',type:a,boost});
    if(boost)S.crowd=0;
    if(foe.jump&&!boost){ev.push({who:o,kind:'evade'});if(who==='p')cr(-5)}
    else if(!boost&&rnd()>chance){ev.push({who:o,kind:'dodge'});cr(who==='p'?-5:5)}
    else if(who==='m'&&S.block&&rnd()<S.block){ev.push({who:o,kind:'block'});cr(10)}
    else{const n=Math.min(atkDmg(me,a,boost),foe.hp);foe.hp-=n;ev.push({who:o,kind:'hit',n,boost});
      if(who==='p')cr(a==='power'?20:a==='normal'?12:8);
      if(foe.hp<=0)S.over=who==='p'?'win':'lose'}
  }
  if(regen)me.sta=Math.min(me.smax,me.sta+STA_REGEN);
  return ev;
}
function monsterAI(S,rnd){ // jednoduchá AI, aby se dalo vyhrát: jde k tobě, většinou bije, občas oddechuje, uskočí nebo jen zařve
  const m=S.m,d=dist(S),r=rnd();
  if(d>1)return d>3&&canDo(S,'m','run')?'run':canDo(S,'m','step')?'step':'rest';
  if(m.sta<16||(m.hp<m.max*.45&&r<.2))return 'rest';
  if(r<.3)return 'roar';
  if(r<.38&&canDo(S,'m','jump'))return 'jump';
  const q=rnd();if(q<.2&&canDo(S,'m','power'))return 'power';return q<.55?'quick':'normal';
}
/*END*/

// ---------- stav ----------
const st={nick:null,user:null,floor:1,hp:100,hpMax:100,gear:{},busy:false,health:{}};
let S=null;

// ---------- plátno ----------
const cv=$('cv'),c=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;c.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const bg=new Image();bg.src='img/arena-pozadi.jpg';
const narrow=()=>W<560;
const groundY=()=>narrow()?H*.62:H*.6;
const tx0=()=>Math.max(28,W*.1),tx1=()=>W-Math.max(28,W*.1);
const posX=p=>tx0()+(tx1()-tx0())*p/TRACK;
const R=()=>narrow()?Math.max(24,W*.068):Math.max(26,Math.min(42,W*.032));
// co je právě vidět (plynule se blíží ke skutečnému stavu)
const vis={p:0,m:TRACK,pHop:0,mHop:0,pLunge:0,mLunge:0,pFlash:0,mFlash:0,shake:0,mRoar:0};
const pops=[],embers=[];

function drawBg(t){
  if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight)*1.04,iw=bg.naturalWidth*s,ih=bg.naturalHeight*s;
    c.drawImage(bg,(W-iw)/2+Math.sin(t*.2)*4,(H-ih)/2-H*.04,iw,ih)}
  else{c.fillStyle='#2a0d07';c.fillRect(0,0,W,H)}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(18,6,5,.88)');g.addColorStop(.28,'rgba(18,6,5,.35)');g.addColorStop(.6,'rgba(18,6,5,.2)');g.addColorStop(1,'rgba(18,6,5,.92)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const r=c.createRadialGradient(W/2,groundY(),10,W/2,groundY(),Math.max(W,H)*.6);r.addColorStop(0,'rgba(255,90,20,.22)');r.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=r;c.fillRect(0,0,W,H);
}
function drawTrack(t){
  const y=groundY(),h=Math.max(16,R()*.6),step=(tx1()-tx0())/TRACK;
  for(let i=0;i<=TRACK;i++){const x=posX(i),glow=.35+.25*Math.sin(t*2+i*.7);
    c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x,y+h*.55,step*.46,h*.4,0,0,7);c.fill();
    c.fillStyle='#3b2420';c.strokeStyle=`rgba(255,${120+Math.round(60*glow)},40,${.55+glow*.4})`;c.lineWidth=2;
    c.beginPath();c.roundRect(x-step*.42,y-h*.2,step*.84,h*.7,6);c.fill();c.stroke();
    c.strokeStyle=`rgba(255,140,40,${.35+glow*.3})`;c.lineWidth=1.5;c.beginPath();c.moveTo(x-step*.25,y);c.lineTo(x-step*.05,y+h*.25);c.lineTo(x+step*.2,y+h*.05);c.stroke()}
  // čísla vzdálenosti mezi postavami
  const d=Math.round(vis.m-vis.p);if(d>1){c.font='900 12px "Nunito Sans",system-ui,sans-serif';c.textAlign='center';c.fillStyle='rgba(255,230,200,.75)';
    c.fillText(d+' '+(d<5?'kroky':'kroků'),(posX(vis.p)+posX(vis.m))/2,y+h*1.4)}
}
function hatDraw(r){
  const h=look.hat,col={straw:'#e8c35a',helmet:'#f2c230',fire:'#d6332f',cowboy:'#7a5230',cap:'#2f5d9e',chef:'#ffffff',beret:'#3b2418',crown:'#ffd23a'}[h];
  if(!col)return;c.fillStyle=col;
  if(h==='chef'){c.beginPath();c.ellipse(0,-r*.62,r*.36,r*.24,0,0,7);c.fill();c.fillRect(-r*.26,-r*.6,r*.52,r*.16);return}
  if(h==='crown'){c.beginPath();c.moveTo(-r*.34,-r*.42);for(let i=0;i<=4;i++){c.lineTo(-r*.34+i*r*.17,-r*(i%2?.56:.74))}c.lineTo(r*.34,-r*.42);c.fill();return}
  c.beginPath();c.ellipse(0,-r*.44,r*.6,r*.1,0,0,7);c.fill();c.beginPath();c.ellipse(0,-r*.52,r*.32,r*.2,0,Math.PI,0);c.fill();
}
const gearImg={};for(const [k,s] of [['arena_shield','img/stit-areny.png'],['arena_boots','img/boty-areny.png'],['founder_cape','img/plast-zakladatele.png']]){const i=new Image();i.src=s;gearImg[k]=i}
const arc=v=>Math.sin(v*Math.PI);
const okImg=i=>i&&i.complete&&i.naturalWidth;
function drawPlayer(t){ // celá postava z boku (styl gladiátora), kouká doprava na příšeru
  const u=R(),g=st.gear,walk=S?Math.min(1,Math.abs(S.p.pos-vis.p)*3):0,ph=t*11,
    hop=arc(vis.pHop),lunge=arc(vis.pLunge),breathe=Math.sin(t*2.4)*u*.03;
  const x=posX(vis.p)-u*.4+lunge*u*.9-hop*u*.5,y=groundY()+u*.1-hop*u*1.3; // y = chodidla
  const legA=Math.sin(ph)*.55*walk,armA=Math.sin(ph+Math.PI)*.45*walk;
  const ink='#1a0f08',skin=look.skin,shirt=look.shirt,dark='rgba(0,0,0,.22)';
  const line=(w)=>{c.strokeStyle=ink;c.lineWidth=w||Math.max(1.5,u*.07);c.lineJoin='round';c.lineCap='round'};
  c.save();c.translate(x,y);
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,hop*u*1.3,u*.75*(1-hop*.3),u*.15,0,0,7);c.fill();

const H_MS=3600000,REVIVE_MS=2*H_MS,DAY_MS=86400000,DAY_CAP=200,DEATH_FEE=5;
let skew=0; // posun hodin proti serveru (z hlavičky Date)
const now=()=>Date.now()+skew;
function hlEff(h,t){ // stejný výpočet jako ve hře: nemoc ubírá 10 HP za hodinu, po smrti se za 2 h probudíš sám
  if(!h)return {hp:st.hpMax,sick:false,dead:false,dAt:0,imm:0,tk:t};
  const imm=+h.imm||0;
  if(h.dead){if(t-(+h.dAt||0)>=REVIVE_MS)return {hp:100,sick:false,dead:false,dAt:0,imm,tk:t};return {hp:0,sick:false,dead:true,dAt:+h.dAt||t,imm,tk:t}}
  if(h.sick){const tk=+h.tk||t,n=Math.max(0,Math.floor((t-tk)/H_MS)),v=(+h.hp||0)-10*n;
    if(v<=0){const dAt=tk+Math.ceil((+h.hp||0)/10)*H_MS;if(t-dAt>=REVIVE_MS)return {hp:100,sick:false,dead:false,dAt:0,imm,tk:t};return {hp:0,sick:false,dead:true,dAt,imm,tk:t}}
    return {hp:v,sick:true,dead:false,dAt:0,imm,tk:tk+n*H_MS}}
  return {hp:Math.max(0,Math.min(180,+h.hp||100)),sick:false,dead:false,dAt:0,imm,tk:t};
}
async function api(method,path,body){
  if(!st.user)return null;
  try{const tok=await st.user.getIdToken();
    const r=await fetch(`${LIVE_DB}/${path}.json?auth=${encodeURIComponent(tok)}`,{method,cache:'no-store',body:body===undefined?undefined:JSON.stringify(body)});
    const d=r.headers.get('Date');if(d){const s=Date.parse(d)-Date.now();if(Math.abs(s)>5000)skew=s}
    return r.ok?(method==='GET'?await r.json():true):null}catch(_){return null}
}
let hpSaved=null,hpSaving=Promise.resolve();
function saveHp(dead){ // skutečné HP ve hře: zapisuje se po každém kole a při odchodu
  if(DEMO||!st.user||!S)return Promise.resolve();
  const v=dead?0:S.p.hp;if(v===hpSaved&&!dead)return hpSaving;hpSaved=v;
  const h=st.health,body={hp:v,sick:dead?false:!!h.sick,tk:dead?{'.sv':'timestamp'}:(h.tk||now()),dead:!!dead,dAt:dead?{'.sv':'timestamp'}:0,imm:+h.imm||0,t:{'.sv':'timestamp'}};
  return hpSaving=hpSaving.then(()=>api('PUT','health/'+liveKey(st.nick),body));
}
async function payWin(){ // výhra: patro +1, stříbrné (1. patro 5, jinak 1–5) do denního limitu 200 – vše jedním zápisem
  const k=liveKey(st.nick);
  const [m,f,fd]=await Promise.all([api('GET','money/'+k),api('GET','fight/'+k),api('GET','fightday/'+k)]);
  const f0=Math.max(1,+(f&&f.f)||1);
  if(f0>S.f)return {floor:f0,gain:0,capped:false,left:DAY_CAP,drop:null}; // výhra už je uložená (opakovaný pokus)
  const day=Math.floor(now()/DAY_MS),sOld=fd&&fd.d===day?+fd.s||0:0,room=Math.max(0,DAY_CAP-sOld);
  let gain=f0===1?(room>=5?5:0):Math.min(1+Math.floor(Math.random()*5),room);
  const body={};body['fight/'+k]={f:f0+1,t:{'.sv':'timestamp'}};
  if(gain>0){body['money/'+k]=(+m||0)+gain;body['fightday/'+k]={d:day,s:sOld+gain}}
  let ok=await api('PATCH','',body);
  if(!ok&&f&&f.t&&now()-f.t<16000){await wait(16000-(now()-f.t));ok=await api('PATCH','',body)} // mezi výhrami musí být aspoň 15 s
  if(!ok&&gain>0){delete body['money/'+k];delete body['fightday/'+k];gain=0;ok=await api('PATCH','',body)} // když neprojdou stříbrné, ať aspoň postoupíš
  return ok?{floor:f0+1,gain,capped:room<=0||(f0===1&&room<5),left:Math.max(0,room-gain),drop:f0===10?'shield':f0===50?'boots':null}:null;
}
async function payDeath(){ // smrt: od 2. patra −5 stříbrných (nikdy pod 0)
  if(S.f<2)return 0;const k=liveKey(st.nick),m=+(await api('GET','money/'+k))||0,fee=Math.min(DEATH_FEE,m);
  if(fee>0&&!await api('PUT','money/'+k,m-fee))return 0;return fee;
}

// ---------- konec boje ----------
function modal(title,html,btns){$('mT').textContent=title;$('mP').innerHTML=html;const row=$('mRow');row.replaceChildren(...btns);$('modal').hidden=false;btns[0]&&btns[0].focus()}
function btn(cls,text,fn){const b=document.createElement(fn?'button':'a');b.className=cls;b.textContent=text;if(fn)b.onclick=fn;else{b.href='./';b.onclick=leave}return b}
async function leave(e){if(DEMO||!st.user||!S||S.over)return;e&&e.preventDefault();await saveHp();location.href='./'}
$('back').onclick=leave;
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveHp()});
async function end(){
  hud();st.busy=true;
  if(S.over==='win'){
    st.hp=S.p.hp;
    if(DEMO){st.floor++;
      modal('Vyhrál jsi! 🏆',`Patro <b>${S.f}</b> je čisté. Zbývá ti <b>${S.p.hp} HP</b>. (Zkušební boj, nic se neukládá.)`,
        [btn('go','Další patro ⚔️',()=>{$('modal').hidden=true;begin()}),btn('city','Do města',null)]);return}
    modal('Vyhrál jsi! 🏆','Ukládám výhru…',[]);
    const [r]=await Promise.all([payWin(),saveHp()]);
    if(!r){modal('Výhru se nepodařilo uložit','Zkus to znovu. Když to nepůjde, vrať se do města a zkus to za chvíli.',[btn('go','Zkusit znovu',()=>end()),btn('city','Do města',null)]);return}
    st.floor=r.floor;if(r.drop==='shield')st.gear.shield='arena_shield';if(r.drop==='boots'){st.gear.boots='arena_boots';st.hpMax=hpMaxOf(st.gear)}
    const money=r.gain?`Dostáváš <b>${r.gain} stříbrných</b>${r.left<DAY_CAP?` (dnes ještě můžeš získat ${r.left})`:''}.`:r.capped?'Dnešní limit 200 stříbrných z arény máš vyčerpaný, za výhru teď jen postupuješ. Zítra se limit obnoví.':'';
    const drop=r.drop==='shield'?'<br><br>🛡️ <b>Štít podsvětí je tvůj!</b> Epický, blokuje 25 % úderů. Najdeš ho v inventáři.':r.drop==='boots'?'<br><br>🥾 <b>Boty podsvětí jsou tvoje!</b> Legendární, +30 HP a 10 % šance na dvojnásobnou úrodu. Najdeš je v inventáři.':'';
    modal(r.drop?'Obrovská výhra! 🏆':'Vyhrál jsi! 🏆',`Patro <b>${S.f}</b> je čisté. ${money} Zbývá ti <b>${S.p.hp} HP</b>.${drop}<br><br>Pokračuj do patra ${r.floor}, nebo se vrať do města a vyléč se.`,
      [btn('go','Další patro ⚔️',()=>{$('modal').hidden=true;begin()}),btn('city','Do města',null)]);
  }else{
    if(DEMO){modal('Padl jsi 💀',`Příšera na patře <b>${S.f}</b> tě porazila. (Zkušební boj, nic se neukládá.)`,[btn('city','Do města',null)]);return}
    modal('Padl jsi 💀','Ukládám…',[]);
    const [fee]=await Promise.all([payDeath(),saveHp(true)]);
    modal('Padl jsi 💀',`Příšera na patře <b>${S.f}</b> tě porazila. U tvého domu teď stojí hrob. Oživí tě jiný hráč, nebo se za 2 hodiny probudíš sám.<br><br>${S.f<2?'Na 1. patře tě smrt nic nestojí.':fee?`Smrt tě stála <b>${fee} stříbrných</b>.`:'Neměl jsi žádné stříbrné, takže tě smrt nic nestála.'} Příště pokračuješ na patře ${S.f}.`,[btn('city','Do města',null)]);
  }
}
function begin(){
  S=newFight(st.floor,Math.max(1,st.hp),st.hpMax,st.gear);vis.p=0;vis.m=TRACK;hpSaved=S.p.hp;st.busy=false;
  turnLabel(true);gearLine();hud();say(st.floor===1?'Prolog: porazíš-li golema, dostaneš <b>5 stříbrných</b>. Jdi k němu.':'Příšera čeká na konci dráhy. Jdi k ní.');
}

// ---------- přihlášení a načtení postavy ----------
const load=src=>new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.append(s)});
function gate(title,text,link){modal(title,text,[link===false?null:btn('gold',link||'Zpět na planetu',null)].filter(Boolean));st.busy=true;hud()}
function wearOf(items,equip,floor,extra){ // stejně jako ve hře: uložené vybavení, jinak to, co máš
  const own=[...Object.keys(items||{}),...(extra||[])];if(floor>10)own.push('arena_shield');if(floor>50)own.push('arena_boots');
  const SLOT={boss_sword:'weapon',basic_sword:'weapon',basic_sword_g:'weapon',earth_heart_1:'talisman',earth_heart_2:'talisman',earth_heart_3:'talisman',founder_cape:'banner',arena_shield:'shield',wood_sword_1:'weapon',wood_sword_2:'weapon',wood_sword_3:'weapon',cloth_pants_1:'pants',cloth_pants_2:'pants',cloth_pants_3:'pants',cloth_gloves_1:'gloves',cloth_gloves_2:'gloves',cloth_gloves_3:'gloves',arena_boots:'boots'};
  const g={};if(equip&&typeof equip==='object'){for(const [s,it] of Object.entries(equip))if(SLOT[it]===s&&own.includes(it))g[s]=it}
  else for(const it of own){const s=SLOT[it];if(s&&!g[s])g[s]=it}
  return g;
}
async function start(){
  if(DEMO){st.nick='zkouška';$('pName').textContent='Zkušební boj';st.floor=Math.max(1,+q.get('f')||1);
    st.gear=wearOf(Object.fromEntries((q.get('g')||'').split(',').filter(Boolean).map(k=>[k,true])),null,st.floor);
    st.hpMax=hpMaxOf(st.gear);st.hp=st.hpMax;begin();return}
  begin();st.busy=true;hud();say('Načítám tvou postavu…');
  try{
    let at=0;try{at=+localStorage.getItem(LOGIN_AT)||0}catch(_){}
    const need=()=>gate('Nejdřív se přihlas','Do arény můžou jen přihlášení hráči. Přihlas se na planetě přes Google a vrať se sem.','Přihlásit se na planetě');
    if(!at||Date.now()-at>SESSION_MS){need();return}
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    await load(B+'firebase-app-compat.js');await load(B+'firebase-auth-compat.js');
    if(!firebase.apps.length)firebase.initializeApp({apiKey:FB_API_KEY,authDomain:'planetafolloweru.firebaseapp.com',databaseURL:LIVE_DB,projectId:'planetafolloweru'});
    const u=await new Promise(ok=>{const off=firebase.auth().onAuthStateChanged(x=>{off();ok(x)})});
    if(!u){need();return}
    st.user=u;const a=await api('GET','accounts/'+u.uid);
    if(!a||!a.nick){st.user=null;gate('Vyber si postavu','Na planetě si nejdřív vyber svou postavu (nick). Pak můžeš do arény.');return}
    if(now()<ARENA_FROM&&a.nick!==ADMIN){st.user=null;gate('Aréna je zavřená','Brána do podsvětí se otevře <b>ve středu 25. 11. ve 12:00</b>.');return}
    st.nick=a.nick;$('pName').textContent='@'+a.nick;
    const k=liveKey(a.nick);
    const [items,equip,fight,health,buys,gifts,dig]=await Promise.all(['items/'+k,'equip/'+k,'fight/'+k,'health/'+k,'buys/'+k,'gifts/'+k,'dig'].map(P=>api('GET',P)));
    const extra=Object.keys(buys||{}).filter(x=>x!=='last'); // koupené v obchodě
    if(gifts&&gifts.launch)extra.push('basic_sword_g');if(a.nick==='___1kelly1___')extra.push('boss_sword');
    if(dig&&now()>1795388399000){const top=Object.entries(dig).filter(([,v])=>v&&+v.c>0).sort((x,y)=>(+y[1].c-+x[1].c)||((+x[1].t||0)-(+y[1].t||0))).slice(0,3).map(([n])=>n),i=top.indexOf(k);if(i>=0)extra.push('earth_heart_'+(i+1))}
    st.floor=Math.max(1,+(fight&&fight.f)||1);st.gear=wearOf(items,equip,st.floor,extra);
    st.hpMax=hpMaxOf(st.gear);
    st.health=hlEff(health,now());
    if(st.health.dead){const left=Math.max(1,Math.ceil((st.health.dAt+REVIVE_MS-now())/60000));
      gate('Jsi mrtvý 💀',`Tvoje postava leží u hrobu. Oživí tě jiný hráč, nebo se sám probudíš asi za <b>${left>=60?Math.floor(left/60)+' h '+left%60+' min':left+' min'}</b>. Pak můžeš zpátky do arény.`);return}
    st.hp=Math.min(st.hpMax,Math.max(1,st.health.hp));
    begin();
    if(st.health.sick)say('🤒 Jsi nemocný, nemoc ti dál ubírá HP. Příšera čeká na konci dráhy.');
  }catch(e){console.warn(e);gate('Něco se pokazilo','Nepodařilo se načíst tvou postavu. Zkus to znovu z planety.')}
}
start();

// ---------- smyčka ----------
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=now/1000;
  if(S){vis.p+=(S.p.pos-vis.p)*Math.min(1,dt*9);vis.m+=(S.m.pos-vis.m)*Math.min(1,dt*9)}
  for(const k of ['pHop','mHop','pLunge','mLunge','pFlash','mFlash','mRoar'])vis[k]=Math.max(0,vis[k]-dt*(k.endsWith('Flash')?2.2:k==='mRoar'?1.4:3.2));
  vis.shake=Math.max(0,vis.shake-dt*3);
  c.save();if(vis.shake>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)c.translate((Math.random()-.5)*14*vis.shake,(Math.random()-.5)*10*vis.shake);
  drawBg(t);drawTrack(t);drawEmbers(dt,t);drawMonster(t);drawPlayer(t);drawPops(dt);
  c.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
